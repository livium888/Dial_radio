<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<title>Dial</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: dark light; --bg:#0c0c0d; --fg:#f4f1ea; --mut:#8f8d87; --line:#ffffff1f; --acc:#ff6a2b; --dial:#151516; --panel:#161617; }
  @media (prefers-color-scheme: light) { :root { --bg:#f1ece3; --fg:#161412; --mut:#7a746a; --line:#00000020; --acc:#e4470f; --dial:#e8e2d6; --panel:#f8f5ee; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #app { height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; overflow-y: auto; padding: calc(10px + env(safe-area-inset-top)) 20px calc(10px + env(safe-area-inset-bottom)); }
  #app > * { flex: none; }
  header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 1.15rem; }
  .brand b { color: var(--acc); }
  nav { display: flex; gap: 2px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .tb { padding: 10px 9px; border-radius: 10px; color: var(--mut); font-size: .95rem; min-height: 44px; }
  .tb:hover, .tb:focus-visible { color: var(--fg); background: var(--line); outline: none; }
  .tb.ic { width: 40px; padding: 10px 0; display: grid; place-items: center; }
  .tb.ic svg { width: 20px; height: 20px; }
  #tabset { display: flex; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #tabset::-webkit-scrollbar { display: none; }
  #tabs .tab { flex: none; }
  #now { margin-top: 10px; }
  body { transition: background-color .5s; }
  .sws { display: flex; justify-content: space-between; gap: 8px; width: 100%; }
  .sws .sw { font-size: .78rem; min-height: 36px; }
  #viz { position: absolute; left: -30px; top: -30px; width: calc(100% + 60px); height: calc(100% + 60px); pointer-events: none; z-index: 0; }
  #dialwrap::before { content: ''; position: absolute; inset: 6%; border-radius: 50%; z-index: 0; pointer-events: none; box-shadow: 0 0 calc(24px + var(--pulse, 0) * 46px) calc(var(--pulse, 0) * 8px) color-mix(in srgb, var(--acc) calc(var(--pulse, 0) * 38%), transparent); }
  #logo { margin-left: auto; height: 26px; width: 26px; object-fit: contain; border-radius: 6px; background: #fff; padding: 2px; flex: none; }
  #logo[hidden] { display: none; }
  .badge { display: flex; align-items: center; gap: 8px; font-size: .72rem; letter-spacing: .14em; color: var(--mut); text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--mut); display: inline-block; flex: none; }
  .badge.live { color: var(--acc); }
  .badge.live i { background: var(--acc); animation: pulse 1.6s ease-in-out infinite; }
  .badge.bad { color: #ff6b6b; }
  .badge.bad i { background: #ff6b6b; }
  #clock { color: var(--mut); }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { margin: 8px 0 2px; font-size: clamp(1.8rem, 8.2vw, 2.7rem); line-height: 1.05; letter-spacing: -.03em; font-weight: 650; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: opacity .2s; }
  #now.tuning h1 { opacity: .4; animation: flick .18s steps(2) infinite; }
  @keyframes flick { 50% { transform: translateX(1px); filter: blur(.6px); } }
  #sub, #meta { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { color: var(--fg); opacity: .8; font-size: 1rem; min-height: 1.4em; }
  #meta { color: var(--mut); font-size: .88rem; min-height: 1.4em; margin-top: 2px; }
  #songbox { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 8px 10px 14px; min-height: 72px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  #songbox.empty { visibility: hidden; }
  .songmain { flex: 1; min-width: 0; }
  .lab2 { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--acc); margin-bottom: 2px; }
  #songtxt { font-size: 1.05rem; line-height: 1.25; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  #songtxt.mut { color: var(--mut); font-weight: 400; font-size: .92rem; }
  #songtag { color: var(--mut); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; min-height: 1em; }
  .songact { display: flex; align-items: center; gap: 2px; flex: none; }
  .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; min-height: 40px; }
  .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chip[hidden] { display: none; }
  #stage { flex: 1 1 0; min-height: 190px; display: grid; place-items: center; margin: 4px 0; container-type: size; }
  #dialwrap { --S: min(66vw, 300px, 30dvh); position: relative; width: var(--S); height: var(--S); }
  @supports (width: 1cqw) { #dialwrap { --S: calc(min(100cqw, 100cqh, 340px) - 66px); } }
  #pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 11px solid var(--acc); z-index: 2; }
  #dial { position: absolute; inset: 0; border-radius: 50%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; outline: none; }
  #dial:focus-visible { box-shadow: 0 0 0 2px var(--acc); }
  #dial:active { cursor: grabbing; }
  #dial svg { width: 100%; height: 100%; display: block; }
  #center { position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--acc); color: var(--bg); display: grid; place-items: center; z-index: 3; transition: transform .1s; }
  #center:active { transform: translate(-50%, -50%) scale(.95); }
  #center svg { width: 40%; height: 40%; }
  #ring { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); pointer-events: none; transform: rotate(-90deg); z-index: 1; }
  #row { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 4px; }
  .ib { width: 62px; min-height: 62px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--fg); padding: 6px 0; }
  .ib:hover, .ib:focus-visible { background: var(--line); outline: none; }
  .ib svg { width: 24px; height: 24px; }
  .ib .l { font-size: .68rem; color: var(--mut); letter-spacing: .02em; }
  .ib.on, .ib.on .l { color: var(--acc); }
  .ib.sm { width: 44px; min-height: 44px; padding: 0; }
  #moods { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
  #moods[hidden] { display: none; }
  #foot { display: flex; flex-direction: column; align-items: stretch; gap: 0; margin-top: 6px; min-height: 44px; font-size: .82rem; color: var(--mut); }
  #status { flex: 1; min-width: 0; }
  #status.err { color: #ff6b6b; }
  label.sw { display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; min-height: 44px; padding-left: 8px; }
  label.sw input { accent-color: var(--acc); width: 20px; height: 20px; }
  #sheetbg { position: fixed; inset: 0; background: #000a; z-index: 10; display: none; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; height: min(78dvh, 640px); background: var(--panel); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; z-index: 11; display: none; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  body.sheet-open #sheetbg { display: block; }
  body.sheet-open #sheet { display: flex; }
  #tabs { display: flex; align-items: center; gap: 2px; padding: 10px 12px 4px; }
  #tabs .tab { padding: 10px 11px; border-radius: 10px; color: var(--mut); min-height: 44px; }
  #tabs .tab.on { color: var(--fg); background: var(--line); }
  #tabs .x { margin-left: auto; padding: 10px 12px; color: var(--mut); min-height: 44px; }
  #sbody { flex: 1; overflow-y: auto; padding: 8px 16px 20px; }
  .field { display: block; width: 100%; margin: 6px 0; padding: 12px 14px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; min-height: 48px; }
  .go { display: block; width: 100%; margin: 12px 0; padding: 14px; border-radius: 12px; background: var(--acc); color: var(--bg); font-weight: 650; min-height: 48px; }
  .lab { margin: 14px 0 2px; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
  .item { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .item .t { flex: 1; min-width: 0; cursor: pointer; }
  .item .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .m { font-size: .82rem; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .rm { color: var(--mut); padding: 10px; min-width: 44px; min-height: 44px; }
  .empty-msg { color: var(--mut); padding: 24px 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 .field, .grid2 .go { margin-top: 6px; margin-bottom: 6px; }
  .chipscroll { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; scrollbar-width: none; }
  .chipscroll::-webkit-scrollbar { display: none; }
  .chipscroll .chip { flex: none; white-space: nowrap; }
  .sumbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0 0; font-size: .8rem; color: var(--mut); }
  .sumbar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go:disabled, .chip:disabled { opacity: .45; }
  .actrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
  .note { font-size: .85rem; color: var(--mut); margin: 6px 0; }
  .ghost { background: var(--line); color: var(--fg); }
  /* landscape phones and tablets: two columns, dial on the right */
  @media (orientation: landscape) and (min-width: 640px) {
    #app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto auto auto auto 1fr; column-gap: 28px; align-content: start; max-width: 1000px; }
    header { grid-column: 1 / -1; grid-row: 1; }
    #now { grid-column: 1; grid-row: 2; margin-top: 4px; }
    #songbox { grid-column: 1; grid-row: 3; align-self: start; margin-top: 8px; }
    #row { grid-column: 1; grid-row: 4; justify-content: flex-start; gap: 6px; }
    #moods { grid-column: 1; grid-row: 5; justify-content: flex-start; }
    #foot { grid-column: 1; grid-row: 6; align-self: end; }
    #stage { grid-column: 2; grid-row: 2 / 7; min-height: 0; margin: 0; }
  }
  @media (orientation: landscape) and (max-height: 460px) {
    h1 { font-size: clamp(1.4rem, 5vh, 2rem); margin: 4px 0 0; }
    #songbox { min-height: 56px; padding-top: 6px; padding-bottom: 6px; }
    .ib { min-height: 48px; width: 54px; } .ib .l { display: none; }
    #sub { min-height: 0; } #meta { min-height: 0; }
    label.sw { min-height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { .badge.live i, #now.tuning h1 { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">di<b>a</b>l</div>
    <nav>
      <button class="tb ic" id="bSearch" aria-label="Search stations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="tb" id="bBand">Band</button>
      <button class="tb" id="bSaved">Saved</button>
      <button class="tb" id="bHeard">Heard</button>
      <button class="tb ic" id="bMore" aria-label="More: sleep timer, backup"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </nav>
  </header>

  <section id="now" aria-live="polite">
    <div class="badge" id="badge"><i></i><span id="btxt">Loading</span><span id="clock"></span><img id="logo" alt="" hidden></div>
    <h1 id="name">Tuning in…</h1>

    <p id="meta"></p>
  </section>

  <div id="songbox" class="empty">

      <div class="lab2">Now playing</div>
      <div id="songtxt" aria-live="polite"></div>
      <div id="songtag"></div>
    </div>
    <div class="songact">
      <button class="chip" id="songbtn" hidden>Identify</button>
      <button class="ib sm" id="songhist" aria-label="Song history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    </div>
  </div>

  <div id="stage">
    <section id="dialwrap"><canvas id="viz" aria-hidden="true"></canvas>
      <div id="pointer"></div>
      <svg id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="ringc" cx="50" cy="50" r="49" fill="none" stroke="var(--acc)" stroke-width="1" stroke-linecap="round" stroke-dasharray="307.9" stroke-dashoffset="307.9"></circle></svg>
      <div id="dial" role="slider" tabindex="0" aria-label="Tuning dial" aria-valuemin="1" aria-valuenow="1" aria-valuemax="1">
        <svg viewBox="0 0 200 200" id="dialsvg" aria-hidden="true"></svg>
      </div>
      <button id="center" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="glyph" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
    </section>
  </div>

  <div id="row">
    <button class="ib" id="bPrev" aria-label="Previous station"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="l">Back</span></button>
    <button class="ib" id="bDrift" aria-label="Drift to something new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"/></svg><span class="l">Surprise</span></button>
    <button class="ib" id="bHeart" aria-label="Save station" aria-pressed="false"><svg viewBox="0 0 24 24" id="heartsvg" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg><span class="l">Save</span></button>
    <button class="ib" id="bShare" aria-label="Share station"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg><span class="l">Share</span></button>
    <button class="ib" id="bNext" aria-label="Next station"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg><span class="l">Next</span></button>
  </div>
  <div id="moods" hidden></div>

  <div id="foot">

    <div class="sws"><label class="sw"><input type="checkbox" id="themeon"> Station look</label><label class="sw"><input type="checkbox" id="vizon"> Visuals</label><label class="sw"><input type="checkbox" id="commit"> Commit 60s</label></div>
  </div>
</div>

<div id="sheetbg"></div>
<div id="sheet" role="dialog" aria-label="Library">
  <div id="tabs">
    <div id="tabset">
      <button class="tab" data-t="search">Search</button>
      <button class="tab" data-t="band">Band</button>
      <button class="tab" data-t="saved">Saved</button>
      <button class="tab" data-t="heard">Heard</button>
      <button class="tab" data-t="songs">Songs</button>
      <button class="tab" data-t="more">More</button>

    <button class="x" id="sx" aria-label="Close">Close</button>
  </div>
  <div id="sbody"></div>
</div>
<audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';

  var FALLBACK = ['de1.api.radio-browser.info', 'de2.api.radio-browser.info', 'nl1.api.radio-browser.info', 'at1.api.radio-browser.info'];
  var STEP = 10, COMMIT_MS = 60000, WATCHDOG_MS = 12000, HEARD_AFTER_MS = 20000;
  var MOODS = ['Chill', 'Energy', 'Focus', 'Late'];
  var GENRES = ['pop', 'rock', 'jazz', 'classical', 'news', 'talk', 'electronic', 'dance', 'hip hop', 'country', 'reggae', 'folk', 'soul', 'ambient', 'indie', 'world', 'old time radio', 'radio drama', 'vintage', 'oldies', '1940s'];
  var STOP_TAGS = { music: 1, radio: 1, fm: 1, am: 1, online: 1, internet: 1, live: 1, 'top 40': 1 };

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');

  function mod(n, m) { return ((n % m) + m) % m; }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function secureOnly() { return location.protocol === 'https:'; }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  var statusEl = $('status');
  var statusTimer = null;
  function setStatus(m, err) { statusEl.textContent = m || ''; statusEl.className = err ? 'err' : ''; clearTimeout(statusTimer); if (m) statusTimer = setTimeout(function () { statusEl.textContent = ''; statusEl.className = ''; }, err ? 9000 : 6000); }

  function timeoutFetch(url, ms) {
    var c = new AbortController(); var t = setTimeout(function () { c.abort(); }, ms);
    return fetch(url, { signal: c.signal }).then(function (r) { clearTimeout(t); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }, function (e) { clearTimeout(t); throw e; });
  }
  var servers = null;
  function getServers() {
    if (servers) return Promise.resolve(servers);
    return timeoutFetch('https://all.api.radio-browser.info/json/servers', 6000).then(function (l) {
      var n = l.map(function (s) { return s.name; }).filter(Boolean);
      servers = shuffle(n.length ? n : FALLBACK.slice()); return servers;
    }).catch(function () { servers = shuffle(FALLBACK.slice()); return servers; });
  }
  function api(path) {
    return getServers().then(function (srv) {
      var i = 0;
      function attempt() {
        if (i >= srv.length) return Promise.reject(new Error('Station directory unreachable'));
        return timeoutFetch('https://' + srv[i++] + path, 9000).catch(attempt);
      }
      return attempt();
    });
  }
  function httpsParam() { return secureOnly() ? '&is_https=true' : ''; }

  function norm(s) {
    var lon = Number(s.geo_long);
    return { id: s.stationuuid, name: (s.name || '').trim() || 'Unnamed', url: s.url_resolved || s.url, country: s.country || '', tags: (s.tags || '').toLowerCase(), bitrate: s.bitrate || 0, codec: (s.codec || '').toUpperCase(), cc: (s.countrycode || '').toUpperCase(), favicon: s.favicon || '', lon: (s.geo_long != null && isFinite(lon) && lon !== 0) ? lon : null };
  }
  var TIERS = ['Unrated', 'Low', 'OK', 'Good', 'Hi-fi', 'Lossless'];
  function codecFamily(s) {
    var c = s.codec || '';
    if (c.indexOf('AAC') >= 0) return 'AAC';
    if (c === 'OGG' || c === 'VORBIS' || c === 'OPUS') return 'OGG';
    if (c === 'MP3') return 'MP3';
    if (c === 'FLAC') return 'FLAC';
    return 'Other';
  }
  function effBitrate(s) {
    var b = s.bitrate || 0, c = s.codec || '';
    if (!b) return 0;
    if (c === 'AAC+' || c === 'HE-AAC' || c === 'AACP') return b * 2;
    if (c.indexOf('AAC') >= 0) return b * 1.33;
    if (c === 'OGG' || c === 'VORBIS' || c === 'OPUS') return b * 1.3;
    return b;
  }
  function tierOf(s) {
    if (codecFamily(s) === 'FLAC') return 'Lossless';
    var e = effBitrate(s);
    if (!e) return 'Unrated';
    if (e >= 192) return 'Hi-fi';
    if (e >= 112) return 'Good';
    if (e >= 56) return 'OK';
    return 'Low';
  }
  function tierRank(s) { return TIERS.indexOf(tierOf(s)); }
  function summarize(list) {
    var q = {}, c = {};
    list.forEach(function (s) { var t = tierOf(s), f = codecFamily(s); q[t] = (q[t] || 0) + 1; c[f] = (c[f] || 0) + 1; });
    var qs = TIERS.slice().reverse().filter(function (t) { return q[t]; }).map(function (t) { return t + ' ' + q[t]; }).join(' · ');
    var cs = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; }).map(function (f) { return f + ' ' + c[f]; }).join(' · ');
    return { q: qs, c: cs };
  }
  function filterQuality(list, codec, minRank) {
    return list.filter(function (s) { return (!codec || codecFamily(s) === codec) && tierRank(s) >= minRank; });
  }
  function cleanList(res) {
    var seen = {}, out = [];
    res.forEach(function (r) { var s = norm(r); var k = s.name.toLowerCase(); if (!s.url || seen[k]) return; seen[k] = 1; out.push(s); });

    return tagsPromise.catch(function (e) { tagsPromise = null; throw e; });
  }
  function loadLangs() {
    if (!langsPromise) langsPromise = api('/json/languages?hidebroken=true&order=stationcount&reverse=true&limit=60').then(function (ls) { return ls.filter(function (l) { return l.name && l.stationcount > 0; }); });
    return langsPromise.catch(function (e) { langsPromise = null; throw e; });
  }
  function searchPath(f, offset, page) {
    var p = '/json/stations/search?hidebroken=true&limit=' + page + '&offset=' + offset + '&' + SORT_API[f.ord] + httpsParam();
    if (f.q) p += '&name=' + encodeURIComponent(f.q);
    if (f.cc) p += '&countrycode=' + encodeURIComponent(f.cc);
    if (f.tag) p += '&tag=' + encodeURIComponent(f.tag);
    if (f.lang) p += '&language=' + encodeURIComponent(f.lang) + '&languageExact=true';
    return p;
  }
  function stationSub(x) {
    var tr = tierOf(x);
    return [shortCountry(x), (x.tags || '').split(',')[0].trim(), tr === 'Unrated' ? '' : tr + (x.codec && x.codec !== 'UNKNOWN' ? ' ' + x.codec : '')].filter(Boolean).join(' · ');
  }
  function mkSelect(label, opts, val, onch) {
    var sel = el('select', 'field'); sel.setAttribute('aria-label', label);
    opts.forEach(function (a) { var o = el('option', '', a[1]); o.value = a[0]; sel.appendChild(o); });
    sel.value = val; if (sel.value !== String(val)) sel.value = opts[0][0];
    sel.onchange = function () { onch(sel.value); };
    return sel;
  }
  function renderDiscover(box) {
    var st = { list: [], seen: {}, offset: 0, done: false, busy: false, tok: 0, auto: 0, err: '' };
    var timer = null, scc, sl, chipRow, sum, res, more, bPlay, bRand;
    function save() { lsSet('dial-filters', sf); }
    function label() { var bits = [(scc && scc.value && scc.options[scc.selectedIndex]) ? scc.options[scc.selectedIndex].text.replace(/ \(\d+\)$/, '') : '', sf.tag, sf.lang, sf.codec, sf.minr ? TIERS[sf.minr] + '+' : '', sf.q ? '“' + sf.q + '”' : ''].filter(Boolean); return bits.length ? bits.join(' · ') : 'Top stations'; }
    function pageSize() { return (sf.codec || sf.minr) ? 200 : 100; }
    function sortList() { if (sf.ord === 'quality') st.list.sort(function (a, b) { return tierRank(b) - tierRank(a) || effBitrate(b) - effBitrate(a); }); }
    function paint() {
      res.textContent = '';
      var sortName = (SORTS.filter(function (x) { return x[0] === sf.ord; })[0] || [0, ''])[1].toLowerCase();
      sum.textContent = (st.busy && !st.list.length ? 'Searching…' : st.list.length + (st.done ? '' : '+') + ' stations') + ' · ' + label() + ' · ' + sortName;
      if (st.err) res.appendChild(el('div', 'empty-msg', 'Search failed: ' + st.err));
      else if (!st.list.length && !st.busy) res.appendChild(el('div', 'empty-msg', 'No stations match. Loosen a filter.'));
      else if (st.list.length) listItems(res, st.list, stationSub, function (i) { playFromList('Search · ' + label(), st.list, i); });
      more.hidden = st.done || !st.list.length; more.textContent = st.busy ? 'Loading…' : 'Load more';
      bPlay.disabled = bRand.disabled = !st.list.length;
    }
    function run(reset) {
      if (reset) { st.list = []; st.seen = {}; st.offset = 0; st.done = false; st.tok++; st.auto = 0; st.err = ''; }
      else if (st.busy || st.done) return;
      var my = st.tok, page = pageSize(); st.busy = true; paint();
      api(searchPath(sf, st.offset, page)).then(function (r) {
        if (my !== st.tok) return;
        st.offset += r.length; if (r.length < page) st.done = true;
        var fresh = cleanList(r).filter(function (x) { var k = x.name.toLowerCase(); if (st.seen[k]) return false; st.seen[k] = 1; return true; });
        fresh = filterQuality(fresh, sf.codec, sf.minr);
        st.list = st.list.concat(fresh); sortList(); st.busy = false; paint();
        if (!fresh.length && !st.done && st.auto++ < 4) run(false);
      }).catch(function (e) { if (my !== st.tok) return; st.busy = false; st.err = e.message; paint(); });
    }
    function changed() { save(); run(true); }

    var qi = el('input', 'field'); qi.type = 'search'; qi.placeholder = 'Station name, e.g. Kiss FM'; qi.autocomplete = 'off'; qi.value = sf.q; box.appendChild(qi);
    qi.oninput = function () { sf.q = qi.value.trim(); clearTimeout(timer); timer = setTimeout(changed, 350); };
    qi.onkeydown = function (e) { if (e.key === 'Enter') { clearTimeout(timer); sf.q = qi.value.trim(); changed(); qi.blur(); } };

    var g1 = el('div', 'grid2'); box.appendChild(g1);
    scc = mkSelect('Country', [['', 'Anywhere']], '', function (v) { sf.cc = v; changed(); }); g1.appendChild(scc);
    sl = mkSelect('Language', [['', 'Any language']], '', function (v) { sf.lang = v; changed(); }); g1.appendChild(sl);
    loadCountries().then(function (cs) {
      cs.forEach(function (c) { var o = el('option', '', c.name + ' (' + c.stationcount + ')'); o.value = c.iso_3166_1; scc.appendChild(o); });
      scc.value = sf.cc; if (scc.value !== sf.cc) { scc.value = ''; sf.cc = ''; } paint();
    }).catch(function () {});
    loadLangs().then(function (ls) {
      ls.forEach(function (l) { var o = el('option', '', l.name.charAt(0).toUpperCase() + l.name.slice(1) + ' (' + l.stationcount + ')'); o.value = l.name; sl.appendChild(o); });
      sl.value = sf.lang; if (sl.value !== sf.lang) { sl.value = ''; sf.lang = ''; }
    }).catch(function () {});

    box.appendChild(el('div', 'lab', 'Genre'));
    chipRow = el('div', 'chipscroll'); box.appendChild(chipRow);
    function drawChips(tags) {
      chipRow.textContent = '';
      var list = tags.slice(); if (sf.tag && list.indexOf(sf.tag) < 0) list.unshift(sf.tag);
      list.forEach(function (t) {
        var c = el('button', 'chip' + (sf.tag === t ? ' on' : ''), t);
        c.onclick = function () { sf.tag = sf.tag === t ? '' : t; drawChips(tags); changed(); }; chipRow.appendChild(c);
      });
    }
    drawChips(GENRES);
    loadTags().then(function (t) { if (t.length) drawChips(t); }).catch(function () {});

    sum = el('div', 'sumbar'); box.appendChild(sum);
    var act = el('div', 'actrow'); box.appendChild(act);
    var adv = el('div', ''), advOpen = !!(sf.codec || sf.minr || sf.ord !== 'pop');
    adv.hidden = !advOpen;
    var bF = el('button', 'chip' + (advOpen ? ' on' : ''), 'Filters'); bF.onclick = function () { adv.hidden = !adv.hidden; bF.classList.toggle('on', !adv.hidden); }; act.appendChild(bF);
    bPlay = el('button', 'chip', 'Play all'); bRand = el('button', 'chip', 'Random');
    bPlay.onclick = function () { if (st.list.length) playFromList('Search · ' + label(), st.list, 0); };
    bRand.onclick = function () { if (st.list.length) playFromList('Search · ' + label(), st.list, Math.floor(Math.random() * st.list.length)); };
    act.appendChild(bPlay); act.appendChild(bRand);
    var rs = el('button', 'chip', 'Reset'); rs.onclick = function () { sf = Object.assign({}, SF_DEF); save(); renderSheet(); }; act.appendChild(rs);
    box.appendChild(adv);
    var g2 = el('div', 'grid2'); adv.appendChild(g2);
    g2.appendChild(mkSelect('Minimum quality', [['0', 'Any quality'], ['2', 'OK or better'], ['3', 'Good or better'], ['4', 'Hi-fi or better']], String(sf.minr), function (v) { sf.minr = Number(v); changed(); }));
    g2.appendChild(mkSelect('Codec', [['', 'Any codec'], ['MP3', 'MP3'], ['AAC', 'AAC / AAC+'], ['OGG', 'Ogg / Opus']], sf.codec, function (v) { sf.codec = v; changed(); }));
    adv.appendChild(mkSelect('Sort', SORTS, sf.ord, function (v) { sf.ord = v; changed(); }));
    res = el('div', ''); box.appendChild(res);
    more = el('button', 'go ghost', 'Load more'); more.onclick = function () { run(false); }; box.appendChild(more);
    run(true);
  }

  function renderSheet() {
    Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'), function (b) { b.classList.toggle('on', b.dataset.t === sheetTab); });
    var onTab = document.querySelector('#tabs .tab.on'); if (onTab && onTab.scrollIntoView) { try { onTab.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } catch (e) {} }
    var box = $('sbody'); box.textContent = '';
    if (sheetTab === 'band') {
      box.appendChild(el('div', 'lab', 'Current band'));
      box.appendChild(el('div', '', band.label ? band.label + ' · ' + band.stations.length + ' stations' : '—'));
      if (band.stations.length) {
        var sm = summarize(band.stations);
        [['Quality', sm.q], ['Codecs', sm.c]].forEach(function (r) { var n = el('div', '', r[0] + ': ' + r[1]); n.style.cssText = 'font-size:.85rem;color:var(--mut);margin-top:4px'; box.appendChild(n); });
      }
      box.appendChild(el('div', 'lab', 'Country'));
      var sc = el('select', 'field'); sc.id = 'sc'; box.appendChild(sc);
      var o0 = el('option', '', 'Anywhere'); o0.value = ''; sc.appendChild(o0);
      box.appendChild(el('div', 'lab', 'Genre'));
      var sg = el('select', 'field'); box.appendChild(sg);
      var g0 = el('option', '', 'Any genre'); g0.value = ''; sg.appendChild(g0);
      GENRES.forEach(function (g) { var o = el('option', '', g); o.value = g; sg.appendChild(o); });
      box.appendChild(el('div', 'lab', 'Codec'));
      var sk = el('select', 'field'); box.appendChild(sk);
      [['', 'Any codec'], ['MP3', 'MP3'], ['AAC', 'AAC (incl. AAC+)'], ['OGG', 'Ogg / Opus']].forEach(function (a) { var o = el('option', '', a[1]); o.value = a[0]; sk.appendChild(o); });
      box.appendChild(el('div', 'lab', 'Minimum quality'));
      var sm2 = el('select', 'field'); box.appendChild(sm2);
      [['0', 'Any'], ['2', 'OK or better'], ['3', 'Good or better'], ['4', 'Hi-fi or better']].forEach(function (a) { var o = el('option', '', a[1]); o.value = a[0]; sm2.appendChild(o); });
      box.appendChild(el('div', 'lab', 'Dial order'));
      var so = el('select', 'field'); box.appendChild(so);
      [['pop', 'Most popular first'], ['quality', 'Best quality first']].forEach(function (a) { var o = el('option', '', a[1]); o.value = a[0]; so.appendChild(o); });
      box.appendChild(el('div', 'lab', 'Search'));
      var sq = el('input', 'field'); sq.type = 'search'; sq.placeholder = 'Station name'; box.appendChild(sq);
      var go = el('button', 'go', 'Tune this band'); box.appendChild(go);
      var def = (band.cc || defaultCC());
      loadCountries().then(function (cs) {
        cs.forEach(function (c) { var o = el('option', '', c.name + ' (' + c.stationcount + ')'); o.value = c.iso_3166_1; sc.appendChild(o); });
        sc.value = def; if (sc.value !== def) sc.value = '';
      }).catch(function () {});
      go.onclick = async function () {
        go.textContent = 'Tuning…';
        try {
          var cc = sc.value, tag = sg.value, q = sq.value.trim(), codec = sk.value, minr = Number(sm2.value), ord = so.value;
          var list = await loadBand({ cc: cc, tag: tag, q: q, big: !!(codec || minr || ord === 'quality') });
          list = filterQuality(list, codec, minr);
          if (ord === 'quality') list.sort(function (a, b) { return tierRank(b) - tierRank(a) || effBitrate(b) - effBitrate(a); });
          if (!list.length) { go.textContent = 'Nothing found. Loosen the filters.'; return; }
          var lab = [cc || 'World', tag, codec, minr ? TIERS[minr] + '+' : '', q ? '“' + q + '”' : ''].filter(Boolean).join(' · ');
          band = { label: lab, stations: list, cc: cc }; posU = 0; setRot(0, true); closeSheet(); initFx(); tuneIndex(0);
        } catch (e) { go.textContent = 'Failed: ' + e.message; }
      };
    } else if (sheetTab === 'saved') {
      var chips = el('div', ''); chips.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px';
      ['All'].concat(MOODS).forEach(function (m) {
        var c = el('button', 'chip' + ((m === 'All' ? '' : m) === savedMood ? ' on' : ''), m);
        c.onclick = function () { savedMood = m === 'All' ? '' : m; renderSheet(); }; chips.appendChild(c);
      });
      box.appendChild(chips);
      var list2 = saved.filter(function (s) { return !savedMood || s.mood === savedMood; });
      listItems(box, list2, function (s) { return [s.country, s.mood].filter(Boolean).join(' · '); },
        function (i) { playFromList('Saved' + (savedMood ? ' · ' + savedMood : ''), list2, i); },
        function (i) { var id = list2[i].id; saved = saved.filter(function (x) { return x.id !== id; }); lsSet('dial-saved', saved); refreshHeart(); renderSheet(); });
    } else if (sheetTab === 'heard') {
      listItems(box, heard, function (s) { return [s.country, ago(s.ts)].filter(Boolean).join(' · '); },
        function (i) { playFromList('Heard', heard, i); });
      if (heard.length) { var clr = el('button', 'go', 'Clear log'); clr.style.background = 'var(--line)'; clr.style.color = 'var(--fg)'; clr.onclick = function () { heard = []; lsSet('dial-heard', heard); renderSheet(); }; box.appendChild(clr); }
    } else if (sheetTab === 'search') {
      renderDiscover(box);
    } else if (sheetTab === 'more') {
      box.appendChild(el('div', 'lab', 'Sleep timer'));
      var sc2 = el('div', 'chips');
      [0, 15, 30, 45, 60, 90].forEach(function (m) {
        var on = m === 0 ? !sleepT.end : sleepT.end && sleepT.mins === m;
        var c = el('button', 'chip' + (on ? ' on' : ''), m ? m + ' min' : 'Off');
        c.onclick = function () { sleepT.mins = m; setSleep(m); renderSheet(); }; sc2.appendChild(c);
      });
      box.appendChild(sc2);
      box.appendChild(el('div', 'note', 'Fades out over 8 seconds, then stops. The countdown shows next to the station clock.'));
      box.appendChild(el('div', 'lab', 'Back up'));
      box.appendChild(el('div', 'note', 'Saves your Saved stations, Heard log and song history to a file. Your AudD token is never included.'));
      var msg = el('div', 'note'); msg.id = 'bkmsg';
      var ex = el('button', 'go', 'Export backup file'); ex.onclick = function () { var d = exportData(); msg.textContent = 'Exported ' + d.saved.length + ' saved, ' + d.heard.length + ' heard, ' + d.songs.length + ' songs.'; };
      var im = el('button', 'go ghost', 'Import backup file');
      var fi = el('input'); fi.type = 'file'; fi.accept = 'application/json,.json'; fi.hidden = true; fi.id = 'bkfile';
      im.onclick = function () { fi.click(); };

        var f = fi.files && fi.files[0]; if (!f) return;
        f.text().then(function (t) { var r = importData(t); msg.textContent = 'Imported ' + r.saved + ' saved, ' + r.heard + ' heard, ' + r.songs + ' songs (duplicates skipped).'; })
          .catch(function (e) { msg.textContent = e.message; });
      };
      box.appendChild(ex); box.appendChild(im); box.appendChild(fi); box.appendChild(msg);
      if (!/^https?:$/.test(location.protocol)) {
        box.appendChild(el('div', 'lab', 'Install as an app'));
        box.appendChild(el('div', 'note', 'You’re running Dial from a local file, so Chrome can’t offer “Install app”. Upload the files to any https host, open that address in Chrome, then use the ⋮ menu → Install app.'));
      }
    } else { renderSongsTab(box); }
  }
  var countriesPromise = null;
  function loadCountries() {
    if (!countriesPromise) countriesPromise = api('/json/countries?hidebroken=true&order=name').then(function (cs) { return cs.filter(function (c) { return c.iso_3166_1 && c.stationcount > 0; }); });
    return countriesPromise.catch(function (e) { countriesPromise = null; throw e; });
  }
  function defaultCC() { var l = (navigator.language || 'en-GB').split('-'); return l.length > 1 && l[1].length === 2 ? l[1].toUpperCase() : 'GB'; }

  async function init() {
    buildDial(); setGlyph(false); updateRing(); initMediaSession();
    setBadge('Loading', '');
    var sharedId = (location.hash.match(/^#s=([0-9a-f-]{36})$/i) || [])[1];
    var last = lsGet('dial-last', null);
    try {
      var list = await loadBand({ cc: defaultCC() });
      var startId = null, extra = null;
      if (sharedId) { try { var r = await api('/json/stations/byuuid/' + sharedId); if (r && r[0]) { extra = norm(r[0]); startId = extra.id; } } catch (e) {} }
      if (!extra && last && last.id) { extra = last; startId = last.id; }
      if (extra && extra.url && !list.some(function (s) { return s.id === extra.id; })) list.unshift(extra);
      if (!list.length) throw new Error('No stations returned');
      setBand(defaultCC(), list, startId);
      band.cc = defaultCC();
      setBadge('Ready', '');
      setStatus(sharedId && extra ? 'Shared station ready. Press play.' : 'Press play, then turn the dial to tune.');
    } catch (e) {
      setBadge('Offline', 'bad'); $('name').textContent = 'Can’t reach the dial';
      $('meta').textContent = e.message; setStatus('Check your connection, then reload.', true);
    }
  }
  init();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
